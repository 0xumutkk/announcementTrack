name: ESTU staj ilani takibi

on:
  schedule:
    - cron: "33 5 * * *"   # her gün 08:33 (TR)
  workflow_dispatch:
    inputs:
      heartbeat:
        description: "Yeni ilan yoksa da 'çalışıyor' mesajı gönder"
        default: "1"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Duyuruları kontrol et
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEARTBEAT: ${{ github.event.inputs.heartbeat }}
        run: python check.py
      - name: Görülenleri kaydet
        if: always()
        run: |
          git config user.name "staj-bot"
          git config user.email "staj-bot@users.noreply.github.com"
          git add seen.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "seen güncellendi"
          git push || true
